name: Build & Smoke

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 wget gzip cpio make socat imagemagick \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-gtk2-${{ hashFiles('scripts/fetch-deps.sh') }}
      - name: Build ISO
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-deps.sh
          ./scripts/build-rootfs.sh
          ./scripts/build-iso.sh
          ls -lh endroid-os.iso vmlinuz initrd.gz
      - name: QEMU smoke + screenshots
        run: |
          mkdir -p screenshots
          ./scripts/qemu-smoke.sh endroid-os.iso screenshots
          ls -la screenshots
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: endroid-os-iso
          path: |
            endroid-os.iso
            vmlinuz
            initrd.gz
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endroid-screenshots
          path: screenshots/
          if-no-files-found: ignore
